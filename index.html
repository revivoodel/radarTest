<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radar Test</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./radar.css">
</head>

<body>
    <header>
        <button><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="#1f1f1f">
                <path
                    d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z" />
            </svg></button>
        <h1>SIGINT OPS</h1>
        <button>● SECURE • ONLINE</button>

    </header>
    <main>
        <section id="radarSection">
            <div class="left">
                <div class='radar'>
                    <p>●</p>
                    <p>●</p>
                    <p>●</p>
                    <div class='sweep'></div>
                </div>
            </div>
            <div class="right">
                <article>
                    <p class="number">24</p>
                    <p>ACTIVE SIGNALS</p>
                </article>
                <article>
                    <p class="number">07</p>
                    <p>PRIOTITY ALERTS</p>
                </article>
            </div>
        </section>
        <section id="button-erea">
            <button><svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px"
                    fill="#cfc8ca">
                    <path
                        d="m422-232 207-248H469l29-227-185 267h139l-30 208ZM320-80l40-280H160l360-520h80l-40 320h240L400-80h-80Zm151-390Z" />
                </svg>
                <p>New Brief</p>
            </button>
            <button>
                <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px"
                    fill="#cfc8ca">
                    <path
                        d="M320-240 80-480l240-240 57 57-184 184 183 183-56 56Zm320 0-57-57 184-184-183-183 56-56 240 240-240 240Z" />
                </svg>
                <p>Decode</p>
            </button>
            <button>
                <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px"
                    fill="#cfc8ca">
                    <path
                        d="m397-115-99-184-184-99 71-70 145 25 102-102-317-135 84-86 385 68 124-124q23-23 57-23t57 23q23 23 23 56.5T822-709L697-584l68 384-85 85-136-317-102 102 26 144-71 71Z" />
                </svg>
                <p>Request Drone</p>
            </button>
        </section>
        <section id="cards">
            <article>
                <div>
                    <button class="red-botton">CRITIC AL</button>
                    <p>in progress</p>
                </div>
                <p>Operation Nigtfall</p>

                <input type="range" id="range" min="0" max="100" step="1" value="60" disabled>
                <label for="range">60%</label>

            </article>
            <article>
                <div>
                    <button class="red-botton">HIGH</button>
                    <p>Analyzing</p>
                </div>
                <p>Signal Intercept Alpha</p>

                <input type="range" id="range" min="0" max="100" step="1" value="40" disabled>
                <label for="range">40%</label>

            </article>
            <article>
                <div>
                    <button class="yellow-botton">MEDIUM</button>
                    <p>Pending</p>
                </div>
                <p>Asset Recovery</p>

                <input type="range" id="range" min="0" max="100" step="1" value="15" disabled>
                <label for="range">15%</label>

            </article>
            <article>
                <div>
                    <button class="green-botton">HIGH</button>
                    <p>Active</p>
                </div>
                <p>Cyber Defense Grid</p>

                <input type="range" id="range" min="0" max="100" step="1" value="80" disabled>
                <label for="range">80%</label>

            </article>
        </section>
        <section id="detected-button">
            <p>●</p>
            <button>THREAT DETECTED</button>
        </section>
    </main>
    <footer>
        <button class="active">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" >
                <path
                    d="M326-171q-15-11-22-28l-92-241H40v-80h228l92 244 184-485q7-17 22-28t34-11q19 0 34 11t22 28l92 241h172v80H692l-92-244-184 485q-7 17-22 28t-34 11q-19 0-34-11Z" />
            </svg>
            <p >Dashboard</p>
        </button>
        <button>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" ><path d="M197-197q-54-55-85.5-127.5T80-480q0-84 31.5-156.5T197-763l57 57q-44 44-69 102t-25 124q0 67 25 125t69 101l-57 57Zm113-113q-32-33-51-76.5T240-480q0-51 19-94.5t51-75.5l57 57q-22 22-34.5 51T320-480q0 33 12.5 62t34.5 51l-57 57Zm113.5-113.5Q400-447 400-480t23.5-56.5Q447-560 480-560t56.5 23.5Q560-513 560-480t-23.5 56.5Q513-400 480-400t-56.5-23.5ZM650-310l-57-57q22-22 34.5-51t12.5-62q0-33-12.5-62T593-593l57-57q32 32 51 75.5t19 94.5q0 50-19 93.5T650-310Zm113 113-57-57q44-44 69-102t25-124q0-67-25-125t-69-101l57-57q54 54 85.5 126.5T880-480q0 83-31.5 155.5T763-197Z"/></svg>
            <p>Feed</p>
        </button>
        <button>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
            <p>Brief</p>
        </button>

        <button id="question">?</button>
    </footer>

</body>

</html>
